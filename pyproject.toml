[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcoro"
version = "0.2.0"
description = "Modular coronary angiography stenosis inference with Hugging Face checkpoints"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "segmentation-models-pytorch==0.3.3",
    "opencv-contrib-python-headless>=4.8,<5",
    "pydicom>=3,<4",
    "python-dateutil>=2.8,<3",
    "imageio>=2.34,<3",
    "imageio-ffmpeg>=0.5,<1",
    "huggingface-hub>=0.27,<2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
deepcoro = "deepcoro.cli:main"
deepcoro-download = "deepcoro.hub:main"

[tool.setuptools]
packages = ["deepcoro"]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
